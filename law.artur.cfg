# personal law config for running the HH -> bbWW(DL) analysis at CERN (lxplus/afs/eos)
#
# NOTE: this inherits from law.cfg and *not* from law.dl.cfg on purpose. law.dl.cfg pins the
# c24v15 outputs to DESY-only locations via "cfg_c24v15__task_*" keys, and since
# ConfigTask.get_config_lookup_keys inserts the "cfg_" key before the "task_" key, those
# entries would take precedence over any "task_cf.*" override defined here.

[core]

inherit: $HBW_BASE/law.cfg


[analysis]

# defaults for the HH DL analysis on the 2024 campaign
default_analysis: hbw.analysis.hbw_dl.hbw_dl
default_config: c24v15
default_dataset: hh_ggf_hbb_hvv2l2nu_kl1_kt1_powheg

# the hh2bbww-specific jsons/models/trigger SFs live on the DESY NAF by default; /data/dust is not
# mounted at CERN, so point at the local mirror of the eight files cf.BundleExternalFiles needs
hbw_external_base: /afs/cern.ch/work/a/alobanov/TOPOpaper/analysis/hhbbww/data_balduin

dl1_version: 0
event_weights_version: 0
dl_ml_inputs_version: 0


[outputs]

# same as in law.cfg, but without local_desy_dcache (/pnfs/desy.de is not mounted at CERN)
lfn_sources: local_fs_run3_2024_nano_custom_v15, wlcg_fs_desy_store, wlcg_fs_infn_redirector, wlcg_fs_global_redirector

# law.cfg routes CalibrateEvents to the personal DESY dCache, which is right at the NAF -- it is
# the dominant disk term (~112 MB per input file) and only Select/Reduce ever read it. At CERN it
# is exactly wrong: every output goes over the WAN to DESY and every downstream read comes back the
# same way. It cost most of a 50-dataset run before the symptom (law reporting tasks DONE while
# nothing appeared in the local store) was traced to it.
#
# The generic "task_cf.*" line below does NOT cover this: an exact task key beats a glob, so the
# override has to name the task.
task_cf.CalibrateEvents: local, $CF_STORE_LOCAL, hbw_parts

# plots go to a php-plots browsable area on eos
task_cf.Plot*: wlcg, wlcg_fs_plots, hbw_parts
task_hbw.Plot*: wlcg, wlcg_fs_plots, hbw_parts

# everything else stays in the local store (CF_STORE_LOCAL, set in .setups/dev.sh)
task_cf.*: local, $CF_STORE_LOCAL, hbw_parts
task_hbw.*: local, $CF_STORE_LOCAL, hbw_parts


# the custom HHH nano v15 samples are mirrored on afs at CERN, the law.cfg default points to
# /data/dust (DESY NAF) which is not reachable here
[local_fs_run3_2024_nano_custom_v15]

base: file:///afs/cern.ch/user/m/mschrode/public


[wlcg_fs_plots]

webdav_base: davs://eoscms.cern.ch:443/eos/user/${CF_CERN_USER_FIRSTCHAR}/${CF_CERN_USER}/Projects/php-plots/hh2bbww/${CF_STORE_NAME}
xrootd_base: root://eosuser.cern.ch//eos/user/${CF_CERN_USER_FIRSTCHAR}/${CF_CERN_USER}/Projects/php-plots/hh2bbww/${CF_STORE_NAME}
base: &::xrootd_base
create_file_dir: True
use_cache: $CF_WLCG_USE_CACHE
cache_root: $CF_WLCG_CACHE_ROOT
cache_cleanup: $CF_WLCG_CACHE_CLEANUP
cache_max_size: 25GB


[task]

interactive_line_breaks: False
